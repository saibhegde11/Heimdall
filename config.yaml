# ─────────────────────────────────────────────────────────
# Heimdall Load Balancer Configuration
# ─────────────────────────────────────────────────────────

# Backend server pool
# Each backend can have an optional 'weight' (used by weighted-round-robin).
# Default weight is 1 if omitted.
backends:
  - url: "http://127.0.0.1:8001"
    weight: 3
  - url: "http://127.0.0.1:8002"
    weight: 2
  - url: "http://127.0.0.1:8003"
    weight: 1

# Load balancing algorithm
# Options: round-robin | weighted-round-robin | least-connections
algorithm: "round-robin"

# Health check configuration
health_check:
  enabled: true
  interval_seconds: 10      # How often to ping backends
  timeout_seconds: 3         # Timeout per health check request
  unhealthy_threshold: 3     # Consecutive failures before marking unhealthy
  endpoint: "/health"        # Endpoint to ping on each backend

# Rate limiting configuration (per client IP)
rate_limit:
  enabled: true
  max_requests: 50           # Max requests allowed per window
  window_seconds: 60         # Sliding window duration in seconds
